# SPDX-License-Identifier: Apache-2.0

# SoC Memória Externa (8 MB Octal PSRAM + Cache 64 KB)
CONFIG_ESP_SPIRAM=y
CONFIG_SPIRAM_MODE_OCT=y
CONFIG_SPIRAM_SPEED_80M=y
CONFIG_ESP32S3_DATA_CACHE_64KB=y
CONFIG_ESP32S3_DATA_CACHE_LINE_64B=y
CONFIG_SHARED_MULTI_HEAP=y
CONFIG_ESP_SPIRAM_HEAP_SIZE=4194304

# Periféricos Base
CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_LOG=y
CONFIG_HEAP_MEM_POOL_SIZE=16384

# Touchscreen Capacitivo Goodix GT911 (Polling via I2C0, pois R33 INT é NC na PCB)
CONFIG_INPUT=y
CONFIG_INPUT_GT911=y
CONFIG_INPUT_GT911_PERIOD_MS=15

# Subsistema de Display & Driver Paralelo RGB (LCD_CAM + GDMA)
CONFIG_DISPLAY=y
CONFIG_DISPLAY_ESP32_LCD_CAM_RGB=y
CONFIG_DISPLAY_ESP32_LCD_CAM_RGB_FB_NUM=1
CONFIG_DISPLAY_ESP32_LCD_CAM_RGB_BOUNCE_BUFFER_LINES=17
CONFIG_DISPLAY_ESP32_LCD_CAM_RGB_RESTART_IN_VSYNC=n

# LVGL (Interface Gráfica)
CONFIG_LVGL=y
CONFIG_LV_Z_MEM_POOL_SIZE=65536
CONFIG_LV_Z_VDB_SIZE=20
CONFIG_LV_Z_DOUBLE_VDB=y
CONFIG_LV_Z_BITS_PER_PIXEL=16
CONFIG_LV_COLOR_DEPTH_16=y
CONFIG_LV_USE_LABEL=y
CONFIG_LV_USE_BUTTON=y
CONFIG_LV_USE_ARC=y
CONFIG_LV_USE_BAR=y
CONFIG_LV_USE_SLIDER=y
CONFIG_LV_USE_LINE=y
CONFIG_LV_FONT_MONTSERRAT_12=y
CONFIG_LV_FONT_MONTSERRAT_14=y
CONFIG_LV_FONT_MONTSERRAT_16=y
CONFIG_LV_FONT_MONTSERRAT_20=y
CONFIG_LV_FONT_MONTSERRAT_24=y
CONFIG_LV_FONT_MONTSERRAT_32=y

# Stacks do Sistema
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
